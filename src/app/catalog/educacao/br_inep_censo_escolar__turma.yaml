# ─── CONSULTAS DE EXEMPLO (duas ou três, ensinando o filtro de partição) ──
consultas_exemplo:
  - pergunta: Quantos alunos estudaram em turmas integrais ou semi-integrais em escolas públicas no município de Carpina/PE em 2024?
    sql: |
      SELECT
        SUM(quantidade_matriculas),
        etapa_ensino,
        numero_duracao_turma
      FROM `basedosdados.br_inep_censo_escolar.turma` turma
      INNER JOIN `basedosdados.br_inep_censo_escolar.escola` escola ON
        turma.id_escola = escola.id_escola
      WHERE
        turma.ano = 2024 AND
        turma.id_municipio = '2604007' AND # Município de Carpina
        escola.rede <> '4' # exclusão da rede privada
      GROUP BY
        etapa_ensino,
        numero_duracao_turma
      LIMIT 1000

  - pergunta: Quantos alunos estavam em turmas com aula de inglês, por estado?
    sql: |
      SELECT
        SUM(quantidade_matriculas) AS numero_matriculas,
        turma.disciplina_lingua_ingles,
        sigla_uf
      FROM `basedosdados.br_inep_censo_escolar.turma` turma
      GROUP BY
        turma.disciplina_lingua_ingles,
        sigla_uf
