# ─── IDENTIFICAÇÃO ────────────────────────────────────────────────
id: br_inep_censo_escolar__turma
dataset_id: br_inep_censo_escolar
table_id: turma
nome_exibicao: Censo Escolar — Turmas
area: educacao
fonte: INEP
url_documentacao: https://basedosdados.org/dataset/dae21af4-4b6a-42f4-b94a-4c2061ea9de5?table=a915f6eb-9729-4425-a035-f486d6a83db9
status: rascunho

# ─── RESUMO (etapa 2 — é o ÚNICO texto que o modelo lê para escolher
#     esta tabela; 3 a 6 linhas de prosa, mínimo de 20 palavras) ────
resumo: >
  O Censo Escolar é o principal instrumento de coleta de informações da educação básica e a mais importante pesquisa 
  estatística educacional brasileira. 
  É coordenado pelo Inep e realizado em regime de colaboração entre as secretarias estaduais e municipais de educação 
  e com a participação de todas as escolas públicas e privadas do país.
  A tabela TURMA contém dados que caracterizam as turmas de cada escola brasileira. Entre os dados podemos encontrar 
  as disciplinas feitas pela turma, o horário de começo das aulas, o número de alunos da turma e o nível de ensino no 
  qual se encontra a turma. Há também vários outros aspectos mais específicos, como se a turma passa por atividades 
  complementares, em quais dias da semana ela é ativa e se a turma conta com medidas de inclusão como aulas em Libras 
  e em braille.
  


palavras_chave: [educação, matrículas, turmas, escola, censo escolar, INEP]

perguntas_exemplo:
  - "Quantos alunos estudaram em turmas integrais ou semi-integrais em escolas públicas no município de Carpina/PE em 2024?"
  - "Quantas escolas não tinham turmas integrais nos anos finais do ensino fundamental no município de Cabo de Santo Agostinho/PE em 2024?"
  - "Quantos alunos dos anos iniciais do ensino fundamental não tinham aula de artes no Estado de Pernambuco em 2024?"

# ─── CARACTERÍSTICAS ──────────────────────────────────────────────
grao: informações da turma em determinado ano, contendo a escola (pública ou privada), com características detalhadas da turma, incluindo o número de matrículas para aquela turma.
cobertura_temporal: { inicio: 2007, fim: 2024 }
cobertura_geografica: Estado (UF) e município
# Toda consulta gerada é obrigada a filtrar por estas colunas. Cada nome
# aqui precisa existir em `colunas` com `particao: true`.
particoes: [ano]
sem_particao: false
volume_aproximado: 39.096.570 linhas
observacoes: |
  Para obter dados detalhados da escola, é preciso fazer um JOIN com a tabela br_inep_censo_escolar.escola.
  A Base dos Dados não tem acesso ao nome da escola. Não se preocupe em buscar essa informação.
  Para acessar a API do IBGE, utilize o GET Disponível, substituindo {UF} pela sigla do 
  Estado ou do Distrito Federal.
  Endereço da API - https://servicodados.ibge.gov.br/api/v1/localidades/estados/{UF}/municipios


