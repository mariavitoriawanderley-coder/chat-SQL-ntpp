# Revisado com os metadados oficiais da Base dos Dados (API pública e tabela
# br_inep_censo_escolar.dicionario), consultados em 13/10/2026. Das 76
# colunas da tabela, ficaram as de identificação, etapa, duração, matrículas
# e disciplinas mais pedidas; as demais seguem documentadas no link de
# `url_documentacao`.
#
# O formato completo, campo a campo, está em `catalog/_schema.yaml`.
# Depois de editar:  make validar-catalogo

# ─── IDENTIFICAÇÃO ────────────────────────────────────────────────
id: br_inep_censo_escolar__turma
dataset_id: br_inep_censo_escolar
table_id: turma
nome_exibicao: Censo Escolar — Turmas
area: educacao
fonte: INEP
url_documentacao: https://basedosdados.org/dataset/dae21af4-4b6a-42f4-b94a-4c2061ea9de5?table=a915f6eb-9729-4425-a035-f486d6a83db9
status: rascunho

# ─── RESUMO (etapa 2 — é o ÚNICO texto que o modelo lê para escolher
#     esta tabela; 3 a 6 linhas de prosa, mínimo de 20 palavras) ────
resumo: >
  Todas as turmas da educação básica do Brasil, públicas e privadas,
  coletadas anualmente pelo INEP no Censo Escolar. Cada linha é uma turma em
  um ano, com escola, rede, etapa de ensino, número de matrículas, duração
  diária em minutos, dias da semana e as disciplinas oferecidas. Responde
  perguntas sobre tempo integral, tamanho das turmas, oferta de disciplinas
  (artes, inglês, educação física, LIBRAS) e quantos alunos estão em cada
  etapa, escola ou município.

palavras_chave: [turma, turmas, censo escolar, INEP, tempo integral, jornada escolar, duração da aula, alunos por turma, disciplinas, artes, inglês, educação física, LIBRAS, etapa de ensino]

perguntas_exemplo:
  - "Quantos alunos estudaram em turmas de tempo integral em escolas públicas de Carpina/PE em 2024?"
  - "Quantas escolas não tinham turmas integrais nos anos finais do ensino fundamental no Cabo de Santo Agostinho/PE em 2024?"
  - "Quantos alunos dos anos iniciais do ensino fundamental não tinham aula de artes em Pernambuco em 2024?"

# ─── CARACTERÍSTICAS ──────────────────────────────────────────────
grao: Uma linha por turma em cada ano do Censo Escolar.
cobertura_temporal: { inicio: 2009, fim: 2024 }
cobertura_geografica: Brasil, por UF e município da escola
# Toda consulta gerada é obrigada a filtrar por estas colunas. Cada nome
# aqui precisa existir em `colunas` com `particao: true`.
particoes: [ano, sigla_uf]
sem_particao: false
volume_aproximado: 39,1 milhões de linhas
observacoes: |
  TEMPO INTEGRAL (critério do INEP): turma com jornada diária de 7 horas ou
  mais, ou seja, `numero_duracao_turma >= 420` minutos.

  Alunos se contam somando `quantidade_matriculas`; turmas, contando linhas.
  A rede da escola já está na própria turma (coluna `rede`) — não é preciso
  unir com a tabela de escolas para separar pública e privada.

  Agrupamentos de `etapa_ensino` (códigos em texto): creche = '1';
  pré-escola = '2'; fundamental anos iniciais = '14' a '18';
  fundamental anos finais = '19', '20', '21', '41'; ensino médio = '25' a '29';
  médio integrado ao técnico = '30' a '34'; EJA = '43' a '74' (vários).

  Tipos diferentes da tabela de escolas: aqui `tipo_localizacao` e
  `tipo_localizacao_diferenciada` são números (sem aspas no filtro).

  Nome do município: una com `basedosdados.br_bd_diretorios_brasil.municipio`
  pela coluna `id_municipio`.

# ─── COLUNAS (etapa 3 — só as que alguém usaria de fato) ───────────
colunas:
  - nome: ano
    tipo: INT64
    descricao: Ano do Censo Escolar.
    particao: true

  - nome: sigla_uf
    tipo: STRING
    descricao: Sigla da Unidade da Federação da escola.
    particao: true
    valores_exemplo: [PE, AL, PB, BA, SP]

  - nome: id_municipio
    tipo: STRING
    descricao: Código IBGE de 7 dígitos do município da escola.
    valores_exemplo: ["2604007", "2602902", "2611606"]
    nota: Carpina = 2604007; Cabo de Santo Agostinho = 2602902; Recife = 2611606.

  - nome: id_escola
    tipo: STRING
    descricao: Código da escola no INEP (8 dígitos).
    nota: Liga com br_inep_censo_escolar.escola pela mesma coluna.

  - nome: id_turma
    tipo: STRING
    descricao: Código da turma no INEP.

  - nome: rede
    tipo: STRING
    descricao: Rede (dependência administrativa) da escola da turma.
    valores_exemplo: ["1", "2", "3", "4"]
    nota: 1 = Federal; 2 = Estadual; 3 = Municipal; 4 = Privada. Pública = 1, 2 e 3.

  - nome: tipo_localizacao
    tipo: INT64
    descricao: Localização da escola da turma.
    valores_exemplo: ["1", "2"]
    nota: 1 = Urbana; 2 = Rural. Coluna numérica — filtre sem aspas.

  - nome: tipo_localizacao_diferenciada
    tipo: INT64
    descricao: Se a escola fica em área de localização diferenciada.
    valores_exemplo: ["0", "1", "2", "3"]
    nota: 0 = Não se aplica; 1 = Assentamento; 2 = Terra indígena; 3 = Comunidade quilombola; 4 a 6 = Unidades de uso sustentável.

  - nome: etapa_ensino
    tipo: STRING
    descricao: Etapa de ensino da turma.
    valores_exemplo: ["1", "2", "14", "19", "41", "25"]
    nota: >-
      1 = Creche; 2 = Pré-escola; 14 a 18 = 1º ao 5º ano; 19, 20, 21 = 6º ao 8º ano;
      41 = 9º ano; 22 = Fundamental multisseriada; 23 = Correção de fluxo;
      25 a 28 = 1ª a 4ª série do médio; 29 = Médio não seriado;
      30 a 34 = Médio integrado ao técnico; 35 a 38 = Normal/Magistério;
      39 e 40 = Técnico concomitante e subsequente; 69 a 72 = EJA.

  - nome: tipo_turma
    tipo: STRING
    descricao: Tipo de atendimento da turma.
    valores_exemplo: ["0", "4", "5"]
    nota: 0 = Não se aplica (turma comum de escolarização); 1 = Classe hospitalar; 2 = Unidade de internação socioeducativa; 3 = Unidade prisional; 4 = Atividade complementar; 5 = Atendimento educacional especializado (AEE).

  - nome: quantidade_matriculas
    tipo: INT64
    descricao: Número de alunos matriculados na turma.

  - nome: numero_duracao_turma
    tipo: INT64
    descricao: Duração diária da turma, em minutos.
    nota: Tempo integral = 420 minutos (7 horas) ou mais.

  - nome: numero_dias_atividade
    tipo: INT64
    descricao: Número de dias da semana em que a turma tem atividade.

  - nome: hora_inicial
    tipo: INT64
    descricao: Hora de início da turma (0 a 23).

  - nome: educacao_indigena
    tipo: INT64
    descricao: Indica se a escola da turma é indígena.
    valores_exemplo: ["0", "1"]
    nota: 1 = Sim; 0 = Não.

  - nome: disciplina_lingua_portuguesa
    tipo: INT64
    descricao: Indica se a turma tem a disciplina língua portuguesa.
    valores_exemplo: ["0", "1"]
    nota: 1 = Sim; 0 = Não.

  - nome: disciplina_matematica
    tipo: INT64
    descricao: Indica se a turma tem a disciplina matemática.
    valores_exemplo: ["0", "1"]
    nota: 1 = Sim; 0 = Não.

  - nome: disciplina_artes
    tipo: INT64
    descricao: Indica se a turma tem a disciplina artes.
    valores_exemplo: ["0", "1"]
    nota: 1 = Sim; 0 = Não.

  - nome: disciplina_educacao_fisica
    tipo: INT64
    descricao: Indica se a turma tem a disciplina educação física.
    valores_exemplo: ["0", "1"]
    nota: 1 = Sim; 0 = Não.

  - nome: disciplina_lingua_ingles
    tipo: INT64
    descricao: Indica se a turma tem a disciplina inglês.
    valores_exemplo: ["0", "1"]
    nota: 1 = Sim; 0 = Não.

  - nome: disciplina_lingua_espanhol
    tipo: INT64
    descricao: Indica se a turma tem a disciplina espanhol.
    valores_exemplo: ["0", "1"]
    nota: 1 = Sim; 0 = Não.

  - nome: disciplina_informatica_comp
    tipo: INT64
    descricao: Indica se a turma tem a disciplina informática ou computação.
    valores_exemplo: ["0", "1"]
    nota: 1 = Sim; 0 = Não.

  - nome: disciplina_libras
    tipo: INT64
    descricao: Indica se a turma tem a disciplina LIBRAS.
    valores_exemplo: ["0", "1"]
    nota: 1 = Sim; 0 = Não.

  - nome: disciplina_sociologia
    tipo: INT64
    descricao: Indica se a turma tem a disciplina sociologia.
    valores_exemplo: ["0", "1"]
    nota: 1 = Sim; 0 = Não.

  - nome: disciplina_filosofia
    tipo: INT64
    descricao: Indica se a turma tem a disciplina filosofia.
    valores_exemplo: ["0", "1"]
    nota: 1 = Sim; 0 = Não.

  - nome: disciplina_ensino_religioso
    tipo: INT64
    descricao: Indica se a turma tem a disciplina ensino religioso.
    valores_exemplo: ["0", "1"]
    nota: 1 = Sim; 0 = Não.

  - nome: disciplina_profissionalizante
    tipo: INT64
    descricao: Indica se a turma tem disciplinas profissionalizantes.
    valores_exemplo: ["0", "1"]
    nota: 1 = Sim; 0 = Não.

# ─── CONSULTAS DE EXEMPLO (duas ou três, ensinando o filtro de partição) ──
consultas_exemplo:
  - pergunta: Quantos alunos estudaram em turmas de tempo integral em escolas públicas de Carpina/PE em 2024, por etapa?
    sql: |
      SELECT
        CASE
          WHEN etapa_ensino = '1' THEN 'Creche'
          WHEN etapa_ensino = '2' THEN 'Pré-escola'
          WHEN etapa_ensino IN ('14', '15', '16', '17', '18') THEN 'Fundamental - anos iniciais'
          WHEN etapa_ensino IN ('19', '20', '21', '41') THEN 'Fundamental - anos finais'
          WHEN etapa_ensino IN ('25', '26', '27', '28', '29') THEN 'Ensino médio'
          ELSE 'Outras etapas'
        END AS etapa,
        SUM(quantidade_matriculas) AS alunos_tempo_integral
      FROM `basedosdados.br_inep_censo_escolar.turma`
      WHERE ano = 2024
        AND sigla_uf = 'PE'
        AND id_municipio = '2604007'
        AND rede IN ('1', '2', '3')
        AND numero_duracao_turma >= 420
      GROUP BY etapa
      ORDER BY alunos_tempo_integral DESC

  - pergunta: Quantas escolas não tinham turmas integrais nos anos finais do ensino fundamental no Cabo de Santo Agostinho/PE em 2024?
    sql: |
      WITH por_escola AS (
        SELECT
          id_escola,
          MAX(IF(numero_duracao_turma >= 420, 1, 0)) AS tem_integral
        FROM `basedosdados.br_inep_censo_escolar.turma`
        WHERE ano = 2024
          AND sigla_uf = 'PE'
          AND id_municipio = '2602902'
          AND etapa_ensino IN ('19', '20', '21', '41')
        GROUP BY id_escola
      )
      SELECT
        COUNTIF(tem_integral = 0) AS escolas_sem_integral,
        COUNT(*) AS escolas_com_anos_finais
      FROM por_escola

  - pergunta: Quantos alunos dos anos iniciais do ensino fundamental não tinham aula de artes em Pernambuco em 2024?
    sql: |
      SELECT
        IF(disciplina_artes = 1, 'Com artes', 'Sem artes') AS oferta_artes,
        SUM(quantidade_matriculas) AS alunos
      FROM `basedosdados.br_inep_censo_escolar.turma`
      WHERE ano = 2024
        AND sigla_uf = 'PE'
        AND etapa_ensino IN ('14', '15', '16', '17', '18')
        AND tipo_turma = '0'
      GROUP BY oferta_artes
