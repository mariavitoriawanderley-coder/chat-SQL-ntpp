# Revisado com os metadados oficiais da Base dos Dados (API pública),
# consultados em 13/10/2026. Os valores de `rede` e `localizacao` foram
# conferidos na tabela `uf` do mesmo conjunto (mesma convenção). Das 208
# colunas, ficaram os indicadores agregados por etapa; os desdobramentos por
# série seguem documentados no link de `url_documentacao`.
#
# O formato completo, campo a campo, está em `catalog/_schema.yaml`.
# Depois de editar:  make validar-catalogo

# ─── IDENTIFICAÇÃO ────────────────────────────────────────────────
id: br_inep_indicadores_educacionais__escola
dataset_id: br_inep_indicadores_educacionais
table_id: escola
nome_exibicao: Indicadores Educacionais — Escolas
area: educacao
fonte: INEP
url_documentacao: https://basedosdados.org/dataset/63f1218f-c446-4835-b746-f109a338e3a1?table=08a18c0b-f460-4173-b779-ee422907b9db
status: rascunho

# ─── RESUMO (etapa 2 — é o ÚNICO texto que o modelo lê para escolher
#     esta tabela; 3 a 6 linhas de prosa, mínimo de 20 palavras) ────
resumo: >
  Indicadores oficiais do INEP sobre o fluxo e as condições de ensino de cada
  escola de educação básica do Brasil, calculados a cada ano. Cada linha é
  uma escola em um ano, com sua rede e localização. Traz taxas de aprovação,
  reprovação e abandono, distorção idade-série, média de alunos por turma,
  horas-aula diárias e formação dos professores, por etapa. Responde
  perguntas que comparam escolas de um município ou que cruzam o desempenho
  da escola com sua infraestrutura (unindo com o Censo Escolar).

palavras_chave: [taxa de aprovação, reprovação, abandono escolar, evasão, distorção idade-série, alunos por turma, horas-aula, formação docente, indicadores educacionais, INEP, rendimento escolar, fluxo escolar]

perguntas_exemplo:
  - "Qual a taxa de aprovação dos anos iniciais em cada escola pública de Caruaru/PE em 2024?"
  - "Escolas municipais de Agrestina/PE com internet para os alunos têm menor distorção idade-série nos anos finais?"
  - "Quais as escolas do Recife com maior taxa de abandono no ensino médio em 2024?"

# ─── CARACTERÍSTICAS ──────────────────────────────────────────────
grao: Uma linha por escola em cada ano.
cobertura_temporal: { inicio: 2007, fim: 2024 }
cobertura_geografica: Brasil, por escola e município (sem coluna de UF)
# Toda consulta gerada é obrigada a filtrar por estas colunas. Cada nome
# aqui precisa existir em `colunas` com `particao: true`.
particoes: [ano]
sem_particao: false
volume_aproximado: 3,3 milhões de linhas
observacoes: |
  Cada escola aparece uma vez por ano, com sua própria rede e localização —
  não há linhas de 'total' nem de 'publica' como na tabela por município. Para
  escolas públicas, use `rede IN ('federal', 'estadual', 'municipal')`. Os
  valores são minúsculos e sem acento.

  Todas as taxas estão em percentual (0 a 100). Escolas pequenas ou sem
  alunos numa etapa vêm com o indicador vazio (NULL) — filtre IS NOT NULL ao
  ordenar. Não faça média simples entre escolas para chegar ao município: use
  a tabela `br_inep_indicadores_educacionais.municipio`.

  A tabela não tem o nome da escola. Para infraestrutura, rede detalhada ou
  matrículas, una com `br_inep_censo_escolar.escola` por `id_escola` e `ano`.

  Não há coluna de UF: municípios de Pernambuco são os de `id_municipio`
  começando com '26' (`SUBSTR(id_municipio, 1, 2) = '26'`). Nome do município:
  una com `basedosdados.br_bd_diretorios_brasil.municipio`.

  Siglas das colunas: ef = ensino fundamental; em = ensino médio;
  ei = educação infantil; anos_iniciais = 1º ao 5º ano; anos_finais = 6º ao 9º.

# ─── COLUNAS (etapa 3 — só as que alguém usaria de fato) ───────────
colunas:
  - nome: ano
    tipo: INT64
    descricao: Ano de referência do indicador.
    particao: true

  - nome: id_municipio
    tipo: STRING
    descricao: Código IBGE de 7 dígitos do município.
    valores_exemplo: ["2600302", "2604106", "2611606"]
    nota: Agrestina = 2600302; Caruaru = 2604106; Recife = 2611606. Pernambuco = começa com '26'.

  - nome: id_escola
    tipo: STRING
    descricao: Código da escola no INEP (8 dígitos).
    nota: Liga com br_inep_censo_escolar.escola pela mesma coluna (e pelo ano).

  - nome: rede
    tipo: STRING
    descricao: Rede da escola.
    valores_exemplo: [municipal, estadual, federal, privada]
    nota: Pública = federal, estadual e municipal.

  - nome: localizacao
    tipo: STRING
    descricao: Localização da escola.
    valores_exemplo: [urbana, rural]

  - nome: taxa_aprovacao_ef_anos_iniciais
    tipo: FLOAT64
    descricao: Taxa de aprovação nos anos iniciais do ensino fundamental (%).

  - nome: taxa_aprovacao_ef_anos_finais
    tipo: FLOAT64
    descricao: Taxa de aprovação nos anos finais do ensino fundamental (%).

  - nome: taxa_aprovacao_em
    tipo: FLOAT64
    descricao: Taxa de aprovação no ensino médio (%).

  - nome: taxa_reprovacao_ef_anos_iniciais
    tipo: FLOAT64
    descricao: Taxa de reprovação nos anos iniciais do ensino fundamental (%).

  - nome: taxa_reprovacao_ef_anos_finais
    tipo: FLOAT64
    descricao: Taxa de reprovação nos anos finais do ensino fundamental (%).

  - nome: taxa_reprovacao_em
    tipo: FLOAT64
    descricao: Taxa de reprovação no ensino médio (%).

  - nome: taxa_abandono_ef_anos_iniciais
    tipo: FLOAT64
    descricao: Taxa de abandono nos anos iniciais do ensino fundamental (%).

  - nome: taxa_abandono_ef_anos_finais
    tipo: FLOAT64
    descricao: Taxa de abandono nos anos finais do ensino fundamental (%).

  - nome: taxa_abandono_em
    tipo: FLOAT64
    descricao: Taxa de abandono no ensino médio (%).

  - nome: tdi_ef_anos_iniciais
    tipo: FLOAT64
    descricao: Taxa de distorção idade-série nos anos iniciais do fundamental — % de alunos com 2 ou mais anos de atraso.

  - nome: tdi_ef_anos_finais
    tipo: FLOAT64
    descricao: Taxa de distorção idade-série nos anos finais do fundamental — % de alunos com 2 ou mais anos de atraso.

  - nome: tdi_em
    tipo: FLOAT64
    descricao: Taxa de distorção idade-série no ensino médio — % de alunos com 2 ou mais anos de atraso.

  - nome: atu_ei
    tipo: FLOAT64
    descricao: Média de alunos por turma na educação infantil.

  - nome: atu_ef_anos_iniciais
    tipo: FLOAT64
    descricao: Média de alunos por turma nos anos iniciais do ensino fundamental.

  - nome: atu_ef_anos_finais
    tipo: FLOAT64
    descricao: Média de alunos por turma nos anos finais do ensino fundamental.

  - nome: atu_em
    tipo: FLOAT64
    descricao: Média de alunos por turma no ensino médio.

  - nome: had_ef
    tipo: FLOAT64
    descricao: Média de horas-aula diárias no ensino fundamental.

  - nome: had_em
    tipo: FLOAT64
    descricao: Média de horas-aula diárias no ensino médio.

  - nome: dsu_ef
    tipo: FLOAT64
    descricao: Percentual de docentes com curso superior no ensino fundamental.

  - nome: dsu_em
    tipo: FLOAT64
    descricao: Percentual de docentes com curso superior no ensino médio.

  - nome: afd_ef_anos_finais_grupo_1
    tipo: FLOAT64
    descricao: Percentual de docentes dos anos finais com formação adequada à disciplina que lecionam (grupo 1 do indicador AFD).

  - nome: afd_em_grupo_1
    tipo: FLOAT64
    descricao: Percentual de docentes do ensino médio com formação adequada à disciplina que lecionam (grupo 1 do indicador AFD).

# ─── CONSULTAS DE EXEMPLO (duas ou três, ensinando o filtro de partição) ──
consultas_exemplo:
  - pergunta: Qual a taxa de aprovação dos anos iniciais em cada escola pública de Caruaru/PE em 2024?
    sql: |
      SELECT id_escola, rede, localizacao, taxa_aprovacao_ef_anos_iniciais
      FROM `basedosdados.br_inep_indicadores_educacionais.escola`
      WHERE ano = 2024
        AND id_municipio = '2604106'
        AND rede IN ('federal', 'estadual', 'municipal')
        AND taxa_aprovacao_ef_anos_iniciais IS NOT NULL
      ORDER BY taxa_aprovacao_ef_anos_iniciais

  - pergunta: Escolas municipais de Agrestina/PE com internet para os alunos têm menor distorção idade-série nos anos finais?
    sql: |
      SELECT
        CASE esc.internet_alunos
          WHEN 1 THEN 'Com internet para alunos'
          WHEN 0 THEN 'Sem internet para alunos'
          ELSE 'Não informado'
        END AS internet,
        COUNT(*) AS escolas,
        ROUND(AVG(ind.tdi_ef_anos_finais), 1) AS media_simples_tdi_anos_finais
      FROM `basedosdados.br_inep_indicadores_educacionais.escola` AS ind
      INNER JOIN `basedosdados.br_inep_censo_escolar.escola` AS esc
        ON esc.id_escola = ind.id_escola AND esc.ano = ind.ano
      WHERE ind.ano = 2024
        AND esc.ano = 2024
        AND esc.sigla_uf = 'PE'
        AND ind.id_municipio = '2600302'
        AND ind.rede = 'municipal'
        AND ind.tdi_ef_anos_finais IS NOT NULL
      GROUP BY internet

  - pergunta: Quais as escolas do Recife com maior taxa de abandono no ensino médio em 2024?
    sql: |
      SELECT id_escola, rede, taxa_abandono_em
      FROM `basedosdados.br_inep_indicadores_educacionais.escola`
      WHERE ano = 2024
        AND id_municipio = '2611606'
        AND taxa_abandono_em IS NOT NULL
      ORDER BY taxa_abandono_em DESC
      LIMIT 10
