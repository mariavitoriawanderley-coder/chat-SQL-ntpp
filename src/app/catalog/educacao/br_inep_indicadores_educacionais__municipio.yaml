# Revisado com os metadados oficiais da Base dos Dados (API pública),
# consultados em 13/10/2026. Os valores de `rede` e `localizacao` foram
# conferidos na tabela `uf` do mesmo conjunto (mesma convenção). Das 215
# colunas, ficaram os indicadores agregados por etapa; os desdobramentos por
# série seguem documentados no link de `url_documentacao`.
#
# O formato completo, campo a campo, está em `catalog/_schema.yaml`.
# Depois de editar:  make validar-catalogo

# ─── IDENTIFICAÇÃO ────────────────────────────────────────────────
id: br_inep_indicadores_educacionais__municipio
dataset_id: br_inep_indicadores_educacionais
table_id: municipio
nome_exibicao: Indicadores Educacionais — Municípios
area: educacao
fonte: INEP
url_documentacao: https://basedosdados.org/dataset/63f1218f-c446-4835-b746-f109a338e3a1?table=f4d3f4d5-170e-405c-843c-73e670c55a89
status: rascunho

# ─── RESUMO (etapa 2 — é o ÚNICO texto que o modelo lê para escolher
#     esta tabela; 3 a 6 linhas de prosa, mínimo de 20 palavras) ────
resumo: >
  Indicadores oficiais do INEP sobre o fluxo e as condições de ensino da
  educação básica, calculados por município, rede e localização a cada ano.
  Cada linha é um município em um ano para uma combinação de rede (municipal,
  estadual, pública, privada, total) e localização (urbana, rural, total).
  Traz taxas de aprovação, reprovação e abandono, distorção idade-série, média
  de alunos por turma, horas-aula diárias e formação dos professores, por
  etapa. Responde perguntas sobre desempenho e evolução das redes de ensino.

palavras_chave: [taxa de aprovação, reprovação, abandono escolar, evasão, distorção idade-série, alunos por turma, horas-aula, formação docente, indicadores educacionais, INEP, rendimento escolar, fluxo escolar]

perguntas_exemplo:
  - "Qual a taxa de distorção idade-série nos anos finais do ensino fundamental público de Agrestina/PE em 2024?"
  - "Como evoluiu a taxa de abandono no ensino médio público de Caruaru/PE entre 2019 e 2024?"
  - "Quais os 10 municípios de Pernambuco com maior taxa de reprovação nos anos finais da rede municipal em 2024?"

# ─── CARACTERÍSTICAS ──────────────────────────────────────────────
grao: Uma linha por município, ano, rede e localização.
cobertura_temporal: { inicio: 2006, fim: 2024 }
cobertura_geografica: Brasil, por município (sem coluna de UF)
# Toda consulta gerada é obrigada a filtrar por estas colunas. Cada nome
# aqui precisa existir em `colunas` com `particao: true`.
particoes: [ano]
sem_particao: false
volume_aproximado: 1,3 milhão de linhas
observacoes: |
  CADA MUNICÍPIO APARECE VÁRIAS VEZES POR ANO, uma por combinação de rede e
  localização, incluindo linhas de total. Sempre fixe as duas, por exemplo
  `rede = 'publica' AND localizacao = 'total'`, ou o resultado mistura linhas.
  Os valores são minúsculos e sem acento: 'publica', 'total', 'urbana'.

  Todas as taxas estão em percentual (0 a 100). Não some taxas, e evite média
  simples entre municípios — para um total estadual, use a tabela por UF do
  mesmo conjunto (`br_inep_indicadores_educacionais.uf`).

  Não há coluna de UF: municípios de Pernambuco são os de `id_municipio`
  começando com '26' (`SUBSTR(id_municipio, 1, 2) = '26'`). Nome do município:
  una com `basedosdados.br_bd_diretorios_brasil.municipio`.

  Siglas das colunas: ef = ensino fundamental; em = ensino médio;
  ei = educação infantil; anos_iniciais = 1º ao 5º ano; anos_finais = 6º ao 9º.

# ─── COLUNAS (etapa 3 — só as que alguém usaria de fato) ───────────
colunas:
  - nome: ano
    tipo: INT64
    descricao: Ano de referência do indicador.
    particao: true

  - nome: id_municipio
    tipo: STRING
    descricao: Código IBGE de 7 dígitos do município.
    valores_exemplo: ["2600302", "2604106", "2611606"]
    nota: Agrestina = 2600302; Caruaru = 2604106; Recife = 2611606. Pernambuco = começa com '26'.

  - nome: rede
    tipo: STRING
    descricao: Rede de ensino a que o indicador se refere.
    valores_exemplo: [total, publica, municipal, estadual, federal, privada]
    nota: '"publica" soma federal, estadual e municipal. Filtre sempre uma rede.'

  - nome: localizacao
    tipo: STRING
    descricao: Localização das escolas a que o indicador se refere.
    valores_exemplo: [total, urbana, rural]
    nota: Filtre sempre uma localização; use 'total' quando a pergunta não distinguir.

  - nome: taxa_aprovacao_ef_anos_iniciais
    tipo: FLOAT64
    descricao: Taxa de aprovação nos anos iniciais do ensino fundamental (%).

  - nome: taxa_aprovacao_ef_anos_finais
    tipo: FLOAT64
    descricao: Taxa de aprovação nos anos finais do ensino fundamental (%).

  - nome: taxa_aprovacao_em
    tipo: FLOAT64
    descricao: Taxa de aprovação no ensino médio (%).

  - nome: taxa_reprovacao_ef_anos_iniciais
    tipo: FLOAT64
    descricao: Taxa de reprovação nos anos iniciais do ensino fundamental (%).

  - nome: taxa_reprovacao_ef_anos_finais
    tipo: FLOAT64
    descricao: Taxa de reprovação nos anos finais do ensino fundamental (%).

  - nome: taxa_reprovacao_em
    tipo: FLOAT64
    descricao: Taxa de reprovação no ensino médio (%).

  - nome: taxa_abandono_ef_anos_iniciais
    tipo: FLOAT64
    descricao: Taxa de abandono nos anos iniciais do ensino fundamental (%).

  - nome: taxa_abandono_ef_anos_finais
    tipo: FLOAT64
    descricao: Taxa de abandono nos anos finais do ensino fundamental (%).

  - nome: taxa_abandono_em
    tipo: FLOAT64
    descricao: Taxa de abandono no ensino médio (%).

  - nome: tdi_ef_anos_iniciais
    tipo: FLOAT64
    descricao: Taxa de distorção idade-série nos anos iniciais do fundamental — % de alunos com 2 ou mais anos de atraso.

  - nome: tdi_ef_anos_finais
    tipo: FLOAT64
    descricao: Taxa de distorção idade-série nos anos finais do fundamental — % de alunos com 2 ou mais anos de atraso.

  - nome: tdi_em
    tipo: FLOAT64
    descricao: Taxa de distorção idade-série no ensino médio — % de alunos com 2 ou mais anos de atraso.

  - nome: atu_ei
    tipo: FLOAT64
    descricao: Média de alunos por turma na educação infantil.

  - nome: atu_ef_anos_iniciais
    tipo: FLOAT64
    descricao: Média de alunos por turma nos anos iniciais do ensino fundamental.

  - nome: atu_ef_anos_finais
    tipo: FLOAT64
    descricao: Média de alunos por turma nos anos finais do ensino fundamental.

  - nome: atu_em
    tipo: FLOAT64
    descricao: Média de alunos por turma no ensino médio.

  - nome: had_ef
    tipo: FLOAT64
    descricao: Média de horas-aula diárias no ensino fundamental.

  - nome: had_em
    tipo: FLOAT64
    descricao: Média de horas-aula diárias no ensino médio.

  - nome: dsu_ef
    tipo: FLOAT64
    descricao: Percentual de docentes com curso superior no ensino fundamental.

  - nome: dsu_em
    tipo: FLOAT64
    descricao: Percentual de docentes com curso superior no ensino médio.

  - nome: afd_ef_anos_finais_grupo_1
    tipo: FLOAT64
    descricao: Percentual de docentes dos anos finais com formação adequada à disciplina que lecionam (grupo 1 do indicador AFD).

  - nome: afd_em_grupo_1
    tipo: FLOAT64
    descricao: Percentual de docentes do ensino médio com formação adequada à disciplina que lecionam (grupo 1 do indicador AFD).

# ─── CONSULTAS DE EXEMPLO (duas ou três, ensinando o filtro de partição) ──
consultas_exemplo:
  - pergunta: Qual a taxa de distorção idade-série nos anos finais do ensino fundamental público de Agrestina/PE em 2024?
    sql: |
      SELECT tdi_ef_anos_finais
      FROM `basedosdados.br_inep_indicadores_educacionais.municipio`
      WHERE ano = 2024
        AND id_municipio = '2600302'
        AND rede = 'publica'
        AND localizacao = 'total'

  - pergunta: Como evoluiu a taxa de abandono no ensino médio público de Caruaru/PE entre 2019 e 2024?
    sql: |
      SELECT ano, taxa_abandono_em
      FROM `basedosdados.br_inep_indicadores_educacionais.municipio`
      WHERE ano BETWEEN 2019 AND 2024
        AND id_municipio = '2604106'
        AND rede = 'publica'
        AND localizacao = 'total'
      ORDER BY ano

  - pergunta: Quais os 10 municípios de Pernambuco com maior taxa de reprovação nos anos finais da rede municipal em 2024?
    sql: |
      SELECT mun.nome AS municipio, ind.taxa_reprovacao_ef_anos_finais
      FROM `basedosdados.br_inep_indicadores_educacionais.municipio` AS ind
      LEFT JOIN `basedosdados.br_bd_diretorios_brasil.municipio` AS mun
        ON ind.id_municipio = mun.id_municipio
      WHERE ind.ano = 2024
        AND SUBSTR(ind.id_municipio, 1, 2) = '26'
        AND ind.rede = 'municipal'
        AND ind.localizacao = 'total'
        AND ind.taxa_reprovacao_ef_anos_finais IS NOT NULL
      ORDER BY ind.taxa_reprovacao_ef_anos_finais DESC
      LIMIT 10
