# ─── CONSULTAS DE EXEMPLO (duas ou três, ensinando o filtro de partição) ──
consultas_exemplo: [
  SELECT
  AVG(ind_escola.tdi_ef_anos_finais),
  escola.acesso_internet_computador
  FROM `basedosdados.br_inep_indicadores_educacionais.escola` ind_escola
  INNER JOIN `basedosdados.br_inep_censo_escolar.escola` escola ON
  escola.id_escola=ind_escola.id_escola
  WHERE
  ind_escola.ano=2024 
  AND ind_escola.id_municipio='2600302'
  AND ind_escola.rede IN ('municipal')
  AND tdi_ef_anos_finais IS NOT NULL
  AND escola.acesso_internet_computador IS NOT NULL
  GROUP BY
  escola.acesso_internet_computador

  SELECT
  taxa_aprovacao_ef_anos_iniciais,
  id_escola,
  localizacao,
  rede
  FROM `basedosdados.br_inep_indicadores_educacionais.escola` 
  WHERE
  ano=2024 
  AND id_municipio='2604106'
  AND rede NOT IN ('privada')
]
