# ─── RESUMO (etapa 2 — é o ÚNICO texto que o modelo lê para escolher
#     esta tabela; 3 a 6 linhas de prosa, mínimo de 20 palavras) ────
resumo: >
  Os indicadores educacionais atribuem valor estatístico à qualidade do ensino, atendo-se não 
  somente ao desempenho dos alunos mas também ao contexto econômico e social em que as escolas 
  estão inseridas. Eles são úteis principalmente para o monitoramento dos sistemas educacionais,
  considerando o acesso, a permanência e a aprendizagem de todos os alunos. Dessa forma, 
  contribuem para a criação de políticas públicas voltadas para a melhoria da qualidade da 
  educação e dos serviços oferecidos à sociedade pela escola.

  O Índice de Desenvolvimento da Educação Básica (Ideb) foi criado em 2007 e reúne informações 
  sobre o fluxo escolar e o desempenho dos estudantes nas avaliações educacionais.
  O Ideb é calculado a partir dos dados de aprovação escolar coletados pelo Censo Escolar e 
  das médias de desempenho obtidas no Sistema de Avaliação da Educação Básica (Saeb).
  O índice varia de 0 a 10 e combina indicadores de fluxo escolar e de desempenho dos 
  estudantes. Essa metodologia permite analisar, de forma conjunta, informações sobre aprovação 
  e aprendizagem, considerando que alterações em um desses componentes influenciam o resultado 
  do indicador.

  A tabela ESCOLA apresenta os indicadores do Ideb para cada escola brasileira, 
  permitindo a análise da qualidade da educação básica em diferentes escolas situadas em todo
  o país.

palavras_chave: [educação, ideb, desempenho escolar, fluxo escolar, aprendizagem, censo escolar]

perguntas_exemplo:
  - "Qual a taxa de distorção idade-série nos anos finais do ensino fundamental municipal do município de Agrestina/PE em 2024, dividindo-se por escolas que têm (ou não) computador com acesso à internet?"
  - "Qual a taxa de aprovação dos anos iniciais do ensino fundamental público no município de Caruaru/PE em 2024 por escola?"
  - "Qual foi o crescimento da taxa de abandono no ensino médio público no município de Caruaru/PE entre 2020 e 2024 por escola?"

# ─── CARACTERÍSTICAS ──────────────────────────────────────────────
grao: informações do ideb agregadas por município, incluindo taxa de aprovação e de abandono por etapa de ensino.
cobertura_temporal: { inicio: 2007, fim: 2024 }
cobertura_geografica: município e estados (UF)
# Toda consulta gerada é obrigada a filtrar por estas colunas. Cada nome
# aqui precisa existir em `colunas` com `particao: true`.
particoes: [ano]
sem_particao: false
volume_aproximado: 3.346.548 linhas
observacoes: |
  É preciso fazer JOIN com a tabela "br_inep_censo_escolar.escola" para obter informações 
  sobre a escola, como se tem laboratório de ciências, tratamento sanitário, cozinha, etc.
  A base dos dados não têm acesso ao nome da escola. Não se preocupe em buscar essa informação.
  Para acessar a API do IBGE, utilize o GET Disponível, substituindo {UF} pela sigla do 
  Estado ou do Distrito Federal.
  Endereço da API - https://servicodados.ibge.gov.br/api/v1/localidades/estados/{UF}/municipios

