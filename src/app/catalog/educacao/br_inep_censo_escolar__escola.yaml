  - nome: quantidade_turma_educacao_basica
    tipo: INT64
    descricao: Quantidade de turmas da educação básica na escola.

# ─── CONSULTAS DE EXEMPLO (duas ou três, ensinando o filtro de partição) ──
consultas_exemplo:
  - pergunta: Quantas escolas municipais em atividade existiam em cada município de Pernambuco em 2024?
    sql: |
      SELECT
        mun.nome AS municipio,
        COUNT(DISTINCT esc.id_escola) AS escolas_municipais
      FROM `basedosdados.br_inep_censo_escolar.escola` AS esc
      LEFT JOIN `basedosdados.br_bd_diretorios_brasil.municipio` AS mun
        ON esc.id_municipio = mun.id_municipio
      WHERE esc.ano = 2024
        AND esc.sigla_uf = 'PE'
        AND esc.rede = '3'
        AND esc.tipo_situacao_funcionamento = '1'
      GROUP BY municipio
      ORDER BY escolas_municipais DESC

  - pergunta: Quantas matrículas em creche em tempo integral havia em cada município de Pernambuco em 2024?
    sql: |
      SELECT
        id_municipio,
        SUM(quantidade_matricula_infantil_creche_integral) AS matriculas_creche_integral
      FROM `basedosdados.br_inep_censo_escolar.escola`
      WHERE ano = 2024
        AND sigla_uf = 'PE'
      GROUP BY id_municipio
      ORDER BY matriculas_creche_integral DESC

  - pergunta: Quantas escolas públicas em atividade de Pernambuco tinham e não tinham internet para os alunos em 2024?
    sql: |
      SELECT
        CASE internet_alunos
          WHEN 1 THEN 'Com internet para alunos'
          WHEN 0 THEN 'Sem internet para alunos'
          ELSE 'Não informado'
        END AS situacao,
        COUNT(DISTINCT id_escola) AS escolas
      FROM `basedosdados.br_inep_censo_escolar.escola`
      WHERE ano = 2024
        AND sigla_uf = 'PE'
        AND rede IN ('1', '2', '3')
        AND tipo_situacao_funcionamento = '1'
      GROUP BY situacao
