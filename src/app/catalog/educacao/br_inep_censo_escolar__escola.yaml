# Revisado com os metadados oficiais da Base dos Dados (API pública e tabela
# br_inep_censo_escolar.dicionario), consultados em 13/10/2026. Das 455
# colunas da tabela, ficaram as de identificação, infraestrutura e totais de
# matrículas, docentes e turmas; as demais seguem documentadas no link de
# `url_documentacao`.
#
# O formato completo, campo a campo, está em `catalog/_schema.yaml`.
# Depois de editar:  make validar-catalogo

# ─── IDENTIFICAÇÃO ────────────────────────────────────────────────
id: br_inep_censo_escolar__escola
dataset_id: br_inep_censo_escolar
table_id: escola
nome_exibicao: Censo Escolar — Escolas
area: educacao
fonte: INEP
url_documentacao: https://basedosdados.org/dataset/dae21af4-4b6a-42f4-b94a-4c2061ea9de5?table=15e428cb-cce2-41f8-aec5-066d685b5bd5
status: rascunho

# ─── RESUMO (etapa 2 — é o ÚNICO texto que o modelo lê para escolher
#     esta tabela; 3 a 6 linhas de prosa, mínimo de 20 palavras) ────
resumo: >
  Cadastro anual de todas as escolas de educação básica do Brasil, públicas e
  privadas, coletado pelo INEP no Censo Escolar. Cada linha é uma escola em
  um ano, com rede (municipal, estadual, federal, privada), localização urbana
  ou rural, infraestrutura (água, esgoto, internet, biblioteca, laboratórios,
  quadra, acessibilidade) e totais de matrículas por etapa, docentes e
  turmas. Responde perguntas sobre quantas escolas existem, suas condições de
  infraestrutura e o número de alunos por etapa e município.

palavras_chave: [escola, escolas, censo escolar, INEP, matrículas, alunos, creche, pré-escola, ensino fundamental, ensino médio, EJA, tempo integral, infraestrutura escolar, internet, biblioteca, rede municipal, rede estadual]

perguntas_exemplo:
  - "Quantas escolas municipais em atividade existem em cada município de Pernambuco?"
  - "Quantas matrículas em creche em tempo integral havia em cada município de Pernambuco em 2024?"
  - "Quantas escolas públicas de Pernambuco não têm internet para os alunos?"

# ─── CARACTERÍSTICAS ──────────────────────────────────────────────
grao: Uma linha por escola em cada ano do Censo Escolar.
cobertura_temporal: { inicio: 2007, fim: 2025 }
cobertura_geografica: Brasil, por UF e município da escola
# Toda consulta gerada é obrigada a filtrar por estas colunas. Cada nome
# aqui precisa existir em `colunas` com `particao: true`.
particoes: [ano, sigla_uf]
sem_particao: false
volume_aproximado: 4,3 milhões de linhas
observacoes: |
  Para contar escolas que funcionam de fato, filtre
  `tipo_situacao_funcionamento = '1'` (em atividade); a tabela também traz
  escolas paralisadas e extintas.

  As colunas de infraestrutura (agua_potavel, internet, biblioteca etc.) são
  indicadores: 1 = possui; 0 = não possui. As de quantidade somam direto.

  "Escola pública" = rede IN ('1', '2', '3'). A tabela não tem o nome da
  escola. Para dados por turma (duração, disciplinas), use
  `br_inep_censo_escolar.turma`, ligando pela coluna `id_escola`.

  Nome do município: una com `basedosdados.br_bd_diretorios_brasil.municipio`
  pela coluna `id_municipio`.

# ─── COLUNAS (etapa 3 — só as que alguém usaria de fato) ───────────
colunas:
  - nome: ano
    tipo: INT64
    descricao: Ano do Censo Escolar.
    particao: true

  - nome: sigla_uf
    tipo: STRING
    descricao: Sigla da Unidade da Federação da escola.
    particao: true
    valores_exemplo: [PE, AL, PB, BA, SP]

  - nome: id_municipio
    tipo: STRING
    descricao: Código IBGE de 7 dígitos do município da escola.
    valores_exemplo: ["2611606", "2604106", "2604007"]
    nota: Recife = 2611606; Caruaru = 2604106; Carpina = 2604007.

  - nome: id_escola
    tipo: STRING
    descricao: Código da escola no INEP (8 dígitos).
    nota: Use COUNT(DISTINCT id_escola) para contar escolas.

  - nome: rede
    tipo: STRING
    descricao: Rede (dependência administrativa) da escola.
    valores_exemplo: ["1", "2", "3", "4"]
    nota: 1 = Federal; 2 = Estadual; 3 = Municipal; 4 = Privada. Pública = 1, 2 e 3.

  - nome: tipo_situacao_funcionamento
    tipo: STRING
    descricao: Situação de funcionamento da escola no ano.
    valores_exemplo: ["1", "2", "3", "4"]
    nota: 1 = Em atividade; 2 = Paralisada; 3 = Extinta no ano do Censo; 4 = Extinta em anos anteriores.

  - nome: tipo_localizacao
    tipo: STRING
    descricao: Localização da escola.
    valores_exemplo: ["1", "2"]
    nota: 1 = Urbana; 2 = Rural.

  - nome: tipo_localizacao_diferenciada
    tipo: STRING
    descricao: Se a escola fica em área de localização diferenciada.
    valores_exemplo: ["1", "2", "3", "4"]
    nota: 1 = Não está em área diferenciada; 2 = Assentamento; 3 = Terra indígena; 4 = Comunidade quilombola.

  - nome: educacao_indigena
    tipo: INT64
    descricao: Indica se a escola oferece educação indígena.
    valores_exemplo: ["0", "1"]
    nota: 1 = Sim; 0 = Não.

  - nome: agua_potavel
    tipo: INT64
    descricao: Indica se a escola fornece água potável para consumo.
    valores_exemplo: ["0", "1"]
    nota: 1 = Sim; 0 = Não.

  - nome: esgoto_rede_publica
    tipo: INT64
    descricao: Indica se o esgoto da escola vai para a rede pública.
    valores_exemplo: ["0", "1"]
    nota: 1 = Sim; 0 = Não.

  - nome: energia_rede_publica
    tipo: INT64
    descricao: Indica se a energia elétrica da escola vem da rede pública.
    valores_exemplo: ["0", "1"]
    nota: 1 = Sim; 0 = Não.

  - nome: banheiro
    tipo: INT64
    descricao: Indica se a escola tem banheiro.
    valores_exemplo: ["0", "1"]
    nota: 1 = Sim; 0 = Não.

  - nome: alimentacao
    tipo: INT64
    descricao: Indica se a escola oferece alimentação escolar (PNAE).
    valores_exemplo: ["0", "1"]
    nota: 1 = Sim; 0 = Não.

  - nome: biblioteca_sala_leitura
    tipo: INT64
    descricao: Indica se a escola tem biblioteca ou sala de leitura.
    valores_exemplo: ["0", "1"]
    nota: 1 = Sim; 0 = Não.

  - nome: laboratorio_informatica
    tipo: INT64
    descricao: Indica se a escola tem laboratório de informática.
    valores_exemplo: ["0", "1"]
    nota: 1 = Sim; 0 = Não.

  - nome: laboratorio_ciencias
    tipo: INT64
    descricao: Indica se a escola tem laboratório de ciências.
    valores_exemplo: ["0", "1"]
    nota: 1 = Sim; 0 = Não.

  - nome: quadra_esportes
    tipo: INT64
    descricao: Indica se a escola tem quadra de esportes.
    valores_exemplo: ["0", "1"]
    nota: 1 = Sim; 0 = Não.

  - nome: acessibilidade_inexistente
    tipo: INT64
    descricao: Indica que a escola NÃO tem nenhum recurso de acessibilidade (rampa, corrimão, elevador, piso tátil etc.).
    valores_exemplo: ["0", "1"]
    nota: 1 = Não tem nenhum recurso; 0 = Tem pelo menos um.

  - nome: internet
    tipo: INT64
    descricao: Indica se a escola tem acesso à internet.
    valores_exemplo: ["0", "1"]
    nota: 1 = Sim; 0 = Não.

  - nome: internet_alunos
    tipo: INT64
    descricao: Indica se a escola tem internet para uso dos alunos.
    valores_exemplo: ["0", "1"]
    nota: 1 = Sim; 0 = Não.

  - nome: banda_larga
    tipo: INT64
    descricao: Indica se a escola tem internet banda larga.
    valores_exemplo: ["0", "1"]
    nota: 1 = Sim; 0 = Não.

  - nome: acesso_internet_computador
    tipo: INT64
    descricao: Indica se os computadores e tablets usados pelos alunos têm acesso à internet.
    valores_exemplo: ["0", "1"]
    nota: 1 = Sim; 0 = Não.

  - nome: quantidade_computador_aluno
    tipo: INT64
    descricao: Quantidade de computadores em uso pelos alunos.

  - nome: profissional_psicologo
    tipo: INT64
    descricao: Indica se a escola tem psicólogo.
    valores_exemplo: ["0", "1"]
    nota: 1 = Sim; 0 = Não.

  - nome: quantidade_matricula_educacao_basica
    tipo: INT64
    descricao: Total de matrículas na educação básica (todas as etapas).

  - nome: quantidade_matricula_infantil_creche
    tipo: INT64
    descricao: Matrículas em creche (educação infantil, 0 a 3 anos).

  - nome: quantidade_matricula_infantil_creche_integral
    tipo: INT64
    descricao: Matrículas em creche em tempo integral.

  - nome: quantidade_matricula_infantil_pre_escola
    tipo: INT64
    descricao: Matrículas na pré-escola (educação infantil, 4 e 5 anos).

  - nome: quantidade_matricula_fundamental_anos_iniciais
    tipo: INT64
    descricao: Matrículas nos anos iniciais do ensino fundamental (1º ao 5º ano).

  - nome: quantidade_matricula_fundamental_anos_finais
    tipo: INT64
    descricao: Matrículas nos anos finais do ensino fundamental (6º ao 9º ano).

  - nome: quantidade_matricula_fundamental_integral
    tipo: INT64
    descricao: Matrículas no ensino fundamental em tempo integral.

  - nome: quantidade_matricula_medio
    tipo: INT64
    descricao: Matrículas no ensino médio.

  - nome: quantidade_matricula_medio_integral
    tipo: INT64
    descricao: Matrículas no ensino médio em tempo integral.

  - nome: quantidade_matricula_eja
    tipo: INT64
    descricao: Matrículas na educação de jovens e adultos (EJA).

  - nome: quantidade_matricula_especial
    tipo: INT64
    descricao: Matrículas na educação especial.

  - nome: quantidade_docente_educacao_basica
    tipo: INT64
