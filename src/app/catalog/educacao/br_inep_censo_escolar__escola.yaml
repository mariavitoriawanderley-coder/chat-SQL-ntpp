# GABARITO — preencha e troque `status` para `ativo`.
#
# O formato completo, campo a campo, está em `catalog/_schema.yaml`.
# Confira `dataset_id` e `table_id` contra a página da tabela na Base dos
# Dados antes de ativar: eles são o que vai no FROM da consulta.
#
# Depois de editar:  make validar-catalogo

# ─── IDENTIFICAÇÃO ────────────────────────────────────────────────
id: br_inep_censo_escolar__escola
dataset_id: br_inep_censo_escolar
table_id: escola
nome_exibicao: Censo Escolar — Escolas
area: educacao
fonte: INEP
url_documentacao: https://basedosdados.org/dataset/dae21af4-4b6a-42f4-b94a-4c2061ea9de5?table=15e428cb-cce2-41f8-aec5-066d685b5bd5
status: rascunho

# ─── RESUMO (etapa 2 — é o ÚNICO texto que o modelo lê para escolher
#     esta tabela; 3 a 6 linhas de prosa, mínimo de 20 palavras) ────
resumo: >
  O Censo Escolar é o principal instrumento de coleta de informações da educação básica e a 
  mais importante pesquisa estatística educacional brasileira. 
  É coordenado pelo Inep e realizado em regime de colaboração entre as secretarias estaduais e 
  municipais de educação
  e com a participação de todas as escolas públicas e privadas do país.
  A tabela ESCOLA contém dados do Censo Escolar ao nível de cada escola. Os dados são 
  organizados em mais de 400 variáveis que traçam um perfil completo da escola, caracterizando 
  desde a infraestrutura física disponível, a equipe pedagógica, a infraestrutura pedagógica, 
  marcas do período letivo como seu começo e fim, além de várias informações sobre os 
  estudantes da escola. É a única tabela do Censo Escolar liberada pelo Inep a partir de 2021.
  


palavras_chave: [educação, matrículas, turmas, escola, censo escolar, INEP]

perguntas_exemplo:
  - "Quantas matrículas em creches integrais existiam por município do Estado de Pernambuco em 2024?"
  - "Quantas escolas não tinham turmas integrais nos anos finais do ensino fundamental no município de Cabo de Santo Agostinho/PE em 2024?"

# ─── CARACTERÍSTICAS ──────────────────────────────────────────────
grao: informações da turma em determinado ano, contendo a escola (pública ou privada), com características detalhadas da turma, incluindo o número de matrículas para aquela turma.
cobertura_temporal: { inicio: 2009, fim: 2024 }
cobertura_geografica: Estado (UF) e município
# Toda consulta gerada é obrigada a filtrar por estas colunas. Cada nome
# aqui precisa existir em `colunas` com `particao: true`.
particoes: [ano]
sem_particao: false
volume_aproximado: 39.096.570 linhas
observacoes: |
  Para obter dados detalhados da escola, é preciso fazer um JOIN com a tabela escolas.
  A localização pode ser urbana ou rural.
  A Base dos Dados não tem acesso ao nome da escola. Não se preocupe em buscar essa informação.
  Para acessar a API do IBGE, utilize o GET Disponível, substituindo {UF} pela sigla do 
  Estado ou do Distrito Federal.
  Endereço da API - https://servicodados.ibge.gov.br/api/v1/localidades/estados/{UF}/municipios


