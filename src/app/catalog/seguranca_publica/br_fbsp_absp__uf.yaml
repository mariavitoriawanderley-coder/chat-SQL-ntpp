# ─── CONSULTAS DE EXEMPLO (duas ou três, ensinando o filtro de partição) ──
consultas_exemplo:
  - pergunta: Feminicídios em Pernambuco por ano.
    sql: |
      SELECT ano, quantidade_feminicidio
      FROM `basedosdados.br_fbsp_absp.uf`
      WHERE sigla_uf = 'PE'
        AND quantidade_feminicidio IS NOT NULL
      ORDER BY ano

  - pergunta: Mortes violentas intencionais nos estados do Nordeste em 2021.
    sql: |
      SELECT sigla_uf, quantidade_morte_violenta_intencional
      FROM `basedosdados.br_fbsp_absp.uf`
      WHERE ano = 2021
        AND sigla_uf IN ('AL','BA','CE','MA','PB','PE','PI','RN','SE')
      ORDER BY quantidade_morte_violenta_intencional DESC
