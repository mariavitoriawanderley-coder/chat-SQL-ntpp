  - nome: quantidade_morte_a_esclarecer
    tipo: INT64
    descricao: Mortes a esclarecer.

  - nome: quantidade_morte_intervencao_policial_militar_servico
    tipo: INT64
    descricao: Mortes decorrentes de intervenção de policiais militares em serviço.

  - nome: quantidade_morte_intervencao_policial_militar_fora_servico
    tipo: INT64
    descricao: Mortes decorrentes de intervenção de policiais militares fora de serviço.

  - nome: quantidade_morte_intervencao_policial_civil_servico
    tipo: INT64
    descricao: Mortes decorrentes de intervenção de policiais civis em serviço.

  - nome: quantidade_morte_intervencao_policial_civil_fora_servico
    tipo: INT64
    descricao: Mortes decorrentes de intervenção de policiais civis fora de serviço.

  - nome: quantidade_policial_militar_morto_confronto_servico
    tipo: INT64
    descricao: Policiais militares mortos em confronto em serviço.

  - nome: quantidade_policial_civil_morto_confronto_servico
    tipo: INT64
    descricao: Policiais civis mortos em confronto em serviço.

  - nome: quantidade_suicidio
    tipo: INT64
    descricao: Suicídios.

  - nome: quantidade_estupro
    tipo: INT64
    descricao: Estupros, incluindo estupro de vulnerável.

  - nome: quantidade_tentativa_estupro
