# Revisado com os metadados oficiais da Base dos Dados (API pública e tabela
# br_ms_cnes.dicionario), consultados em 13/10/2026. Das 204 colunas da
# tabela, ficaram as que respondem perguntas de gestão; as demais seguem
# documentadas no link de `url_documentacao`.
#
# O formato completo, campo a campo, está em `catalog/_schema.yaml`.
# Depois de editar:  make validar-catalogo

# ─── IDENTIFICAÇÃO ────────────────────────────────────────────────
id: br_ms_cnes__estabelecimento
dataset_id: br_ms_cnes
table_id: estabelecimento
nome_exibicao: CNES — Estabelecimentos de saúde
area: saude
fonte: Ministério da Saúde (DataSUS)
url_documentacao: https://basedosdados.org/dataset/354d6d98-bc09-4e22-a58a-e4eac3a5283c?table=72505728-8867-4b6f-8afd-b732de55854e
status: rascunho

# ─── RESUMO (etapa 2 — é o ÚNICO texto que o modelo lê para escolher
#     esta tabela; 3 a 6 linhas de prosa, mínimo de 20 palavras) ────
resumo: >
  Cadastro mensal de todos os estabelecimentos de saúde do Brasil, públicos e
  privados, mantido pelo Ministério da Saúde no CNES. Cada linha é um
  estabelecimento em um mês, com município, tipo de unidade (hospital, posto
  de saúde, UPA, CAPS, clínica), esfera administrativa, vínculo com o SUS,
  tipos de atendimento e quantidade de leitos e salas. Responde perguntas
  sobre quantos hospitais, unidades básicas ou UPAs existem, onde ficam,
  quantos atendem pelo SUS e como a rede e os leitos evoluíram no tempo.

palavras_chave: [hospital, hospitais, posto de saúde, UBS, unidade básica de saúde, UPA, pronto atendimento, CAPS, clínica, leitos, rede de saúde, SUS, estabelecimento de saúde, CNES]

perguntas_exemplo:
  - "Quantos hospitais públicos existiam no Estado de Pernambuco em dezembro de 2023?"
  - "Quantas UPAs existem em cada município de Pernambuco?"
  - "Como evoluiu o número de leitos clínicos e cirúrgicos em Pernambuco entre 2019 e 2023?"

# ─── CARACTERÍSTICAS ──────────────────────────────────────────────
grao: Uma linha por estabelecimento de saúde em cada mês (o mesmo estabelecimento se repete todo mês).
cobertura_temporal: { inicio: 2005, fim: 2026 }
cobertura_geografica: Brasil, por UF e município do estabelecimento
# Toda consulta gerada é obrigada a filtrar por estas colunas. Cada nome
# aqui precisa existir em `colunas` com `particao: true`.
particoes: [ano]
sem_particao: false
volume_aproximado: 73,9 milhões de linhas
observacoes: |
  A TABELA É MENSAL: cada estabelecimento aparece uma vez por mês. Para contar
  estabelecimentos ou somar leitos, fixe UM mês (ex.: `ano = 2023 AND
  mes = 12`) — somar o ano inteiro conta cada um até 12 vezes. Para contar,
  use COUNT(DISTINCT id_estabelecimento_cnes).

  Público x privado: a partir de 2016 o CNES passou a usar a natureza jurídica.
  Estabelecimento público = `id_natureza_juridica` começando com '1'
  (administração pública). `tipo_esfera_administrativa` vale para os anos
  anteriores e pode vir vazia nos recentes.

  Os quantitativos de leitos são os existentes (SUS e não SUS). O detalhamento
  por especialidade e a quantidade de leitos SUS estão na tabela
  `br_ms_cnes.leito`. O nome do estabelecimento não está na tabela.

  Nome do município: una com `basedosdados.br_bd_diretorios_brasil.municipio`
  pela coluna `id_municipio`.

# ─── COLUNAS (etapa 3 — só as que alguém usaria de fato) ───────────
colunas:
  - nome: ano
    tipo: INT64
    descricao: Ano de referência do cadastro.
    particao: true

  - nome: mes
    tipo: INT64
    descricao: Mês de referência do cadastro (1 a 12).
    nota: Não é partição, mas filtre sempre um mês para não contar o mesmo estabelecimento várias vezes.

  - nome: sigla_uf
    tipo: STRING
    descricao: Sigla da Unidade da Federação do estabelecimento.
    valores_exemplo: [PE, AL, PB, BA, SP]

  - nome: id_municipio
    tipo: STRING
    descricao: Código IBGE de 7 dígitos do município do estabelecimento.
    valores_exemplo: ["2611606", "2604106", "2600302"]
    nota: Recife = 2611606; Caruaru = 2604106; Agrestina = 2600302.

  - nome: id_estabelecimento_cnes
    tipo: STRING
    descricao: Código do estabelecimento no CNES (7 dígitos).
    nota: Use COUNT(DISTINCT id_estabelecimento_cnes) para contar estabelecimentos.

  - nome: id_regiao_saude
    tipo: STRING
    descricao: Código da região de saúde do estabelecimento.

  - nome: tipo_unidade
    tipo: STRING
    descricao: Tipo de unidade de saúde.
    valores_exemplo: ["1", "2", "5", "7", "70", "73"]
    nota: >-
      1 = Posto de saúde; 2 = Centro de saúde/Unidade Básica (UBS); 4 = Policlínica;
      5 = Hospital geral; 7 = Hospital especializado; 15 = Unidade mista;
      20 = Pronto-socorro geral; 21 = Pronto-socorro especializado; 22 = Consultório isolado;
      36 = Clínica/ambulatório especializado; 39 = Apoio de diagnose e terapia;
      43 = Farmácia; 62 = Hospital-dia isolado; 68 = Secretaria de saúde;
      70 = CAPS (atenção psicossocial); 73 = Pronto atendimento (UPA);
      74 = Polo Academia da Saúde. Hospitais = 5, 7, 15 e 62.

  - nome: id_natureza_juridica
    tipo: STRING
    descricao: Natureza jurídica do estabelecimento (código de 4 dígitos da Receita Federal).
    valores_exemplo: ["1244", "1023", "2062", "3999"]
    nota: Começa com 1 = Administração pública; 2 = Entidade empresarial; 3 = Sem fins lucrativos; 4 = Pessoa física.

  - nome: tipo_esfera_administrativa
    tipo: STRING
    descricao: Esfera administrativa do estabelecimento (usada até 2015).
    valores_exemplo: ["1", "2", "3", "4"]
    nota: 1 = Federal; 2 = Estadual; 3 = Municipal; 4 = Privada; 99 = Não informada.

  - nome: tipo_gestao
    tipo: STRING
    descricao: Gestor responsável pelo estabelecimento no SUS.
    valores_exemplo: [M, E, D, S]
    nota: M = Municipal; E = Estadual; D = Dupla; S = Sem gestão; Z = Não informado.

  - nome: tipo_prestador
    tipo: STRING
    descricao: Tipo de prestador de serviço.
    valores_exemplo: ["20", "40", "50", "60", "61"]
    nota: >-
      20 = Privado com fins lucrativos; 22 = Privado optante pelo Simples;
      30 = Público federal; 40 = Público estadual; 50 = Público municipal;
      60 = Privado sem fins lucrativos; 61 = Filantrópico com CNAS válido; 80 = Sindicato.

  - nome: indicador_vinculo_sus
    tipo: INT64
    descricao: Indica se o estabelecimento tem vínculo com o SUS.
    valores_exemplo: ["0", "1"]
    nota: 1 = Sim; 0 = Não.

  - nome: indicador_atendimento_internacao_sus
    tipo: INT64
    descricao: Indica se o estabelecimento oferece internação pelo SUS.
    valores_exemplo: ["0", "1"]
    nota: 1 = Sim; 0 = Não.

  - nome: indicador_atendimento_ambulatorial_sus
    tipo: INT64
    descricao: Indica se o estabelecimento oferece atendimento ambulatorial pelo SUS.
    valores_exemplo: ["0", "1"]
    nota: 1 = Sim; 0 = Não.

  - nome: indicador_atendimento_urgencia_sus
    tipo: INT64
    descricao: Indica se o estabelecimento oferece urgência e emergência pelo SUS.
    valores_exemplo: ["0", "1"]
    nota: 1 = Sim; 0 = Não.

  - nome: indicador_leito_hospitalar
    tipo: INT64
    descricao: Indica se o estabelecimento tem leitos hospitalares.
    valores_exemplo: ["0", "1"]
    nota: 1 = Sim; 0 = Não.

  - nome: quantidade_leito_clinico
    tipo: INT64
    descricao: Quantidade de leitos hospitalares clínicos existentes.

  - nome: quantidade_leito_cirurgico
    tipo: INT64
    descricao: Quantidade de leitos hospitalares cirúrgicos existentes.

  - nome: quantidade_leito_complementar
    tipo: INT64
    descricao: Quantidade de leitos complementares existentes (UTI e unidades intermediárias).

  - nome: quantidade_sala_cirurgia_centro_cirurgico
    tipo: INT64
    descricao: Quantidade de salas de cirurgia em centro cirúrgico.

  - nome: quantidade_sala_parto_normal_centro_obstetrico
    tipo: INT64
    descricao: Quantidade de salas de parto normal em centro obstétrico.

  - nome: quantidade_consultorio_medico_urgencia
    tipo: INT64
    descricao: Quantidade de consultórios médicos de urgência e emergência.

  - nome: tipo_turno
    tipo: STRING
    descricao: Turno de funcionamento do estabelecimento.
    valores_exemplo: ["2", "3", "6"]
    nota: >-
      1 = Turnos intermitentes; 2 = Contínuo 24 horas; 3 = Manhã, tarde e noite;
      4 = Só manhã; 5 = Só tarde; 6 = Manhã e tarde; 7 = Só noite; 99 = Não informado.

  - nome: tipo_nivel_hierarquia
    tipo: STRING
    descricao: Nível de complexidade da atenção oferecida.
    valores_exemplo: ["1", "2", "4", "8"]
    nota: >-
      1 = Atenção básica (PAB); 2 = Média complexidade M1; 3 e 6 = Média M2 e M3;
      4 = Alta complexidade ambulatorial; 5 = Baixa M1 e M2; 7 = Média M3;
      8 = Alta complexidade hospitalar e ambulatorial; 99 = Não informado.

  - nome: tipo_atividade_ensino_pesquisa
    tipo: STRING
    descricao: Atividade de ensino e pesquisa do estabelecimento.
    valores_exemplo: ["1", "4", "5"]
    nota: 1 = Unidade universitária; 2 = Escola superior isolada; 3 = Unidade auxiliar de ensino; 4 = Sem atividade de ensino; 5 = Hospital de ensino.

# ─── CONSULTAS DE EXEMPLO (duas ou três, ensinando o filtro de partição) ──
consultas_exemplo:
  - pergunta: Quantos hospitais públicos existiam no Estado de Pernambuco em dezembro de 2023?
    sql: |
      SELECT COUNT(DISTINCT id_estabelecimento_cnes) AS hospitais_publicos
      FROM `basedosdados.br_ms_cnes.estabelecimento`
      WHERE ano = 2023
        AND mes = 12
        AND sigla_uf = 'PE'
        AND tipo_unidade IN ('5', '7', '15', '62')
        AND SUBSTR(id_natureza_juridica, 1, 1) = '1'

  - pergunta: Quantas UPAs existiam em cada município de Pernambuco em dezembro de 2023?
    sql: |
      SELECT
        mun.nome AS municipio,
        COUNT(DISTINCT cnes.id_estabelecimento_cnes) AS upas
      FROM `basedosdados.br_ms_cnes.estabelecimento` AS cnes
      LEFT JOIN `basedosdados.br_bd_diretorios_brasil.municipio` AS mun
        ON cnes.id_municipio = mun.id_municipio
      WHERE cnes.ano = 2023
        AND cnes.mes = 12
        AND cnes.sigla_uf = 'PE'
        AND cnes.tipo_unidade = '73'
      GROUP BY municipio
      ORDER BY upas DESC

  - pergunta: Como evoluiu o número de leitos clínicos e cirúrgicos em Pernambuco entre 2019 e 2023?
    sql: |
      SELECT
        ano,
        SUM(quantidade_leito_clinico) AS leitos_clinicos,
        SUM(quantidade_leito_cirurgico) AS leitos_cirurgicos
      FROM `basedosdados.br_ms_cnes.estabelecimento`
      WHERE ano BETWEEN 2019 AND 2023
        AND mes = 12
        AND sigla_uf = 'PE'
      GROUP BY ano
      ORDER BY ano
