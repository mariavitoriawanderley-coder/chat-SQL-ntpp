# ─── RESUMO (etapa 2 — é o ÚNICO texto que o modelo lê para escolher
#     esta tabela; 3 a 6 linhas de prosa, mínimo de 20 palavras) ────
resumo: >
  O Cadastro Nacional de Estabelecimentos de Saúde (CNES) é um documento público e 
  sistema de informação oficial de cadastramento de informações acerca de todos os 
  estabelecimentos de saúde do país, independentemente de sua natureza jurídica ou 
  integração com o Sistema Único de Saúde (SUS). Os dados se referem à capacidade 
  instalada e mão de obra assistencial de saúde no Brasil em estabelecimentos de 
  saúde públicos ou privados. O CNES é a base cadastral para operacionalização de 
  diversos sistemas, tais como: Sistema de Informação Ambulatorial (SIA), Sistema de 
  Informação Hospitalar (SIH), e-SUS Atenção Básica (e-SUS AB), entre outros. 
  Atualmente, o CNES é a ferramenta auxiliadora para uma gestão eficaz e eficiente, 
  proporcionando ao gestor o conhecimento da realidade da rede assistencial existente 
  e suas potencialidades e auxiliando no planejamento em saúde em todas as esferas 
  administrativas do Governo.

  A tabela ESTABELECIMENTO fornece informações sobre a gestão e operação dos estabelecimentos de saúde brasileiros.

palavras_chave: [saúde, CNES, estabelecimentos de saúde, SUS, serviços de saúde]

perguntas_exemplo:
  - "Quantos hospitais públicos existiam no Estado de Pernambuco em 2023?"
  - "Quantas Unidades de Pronto Atendimento (UPAs) existiam no município de Agrestina/PE em 2023?"

# ─── CARACTERÍSTICAS ──────────────────────────────────────────────
grao: Informações gerais dos estabelecimentos de saúde, como localização, tipo de gestão, tipo de unidade, serviços oferecidos, entre outros.
cobertura_temporal: { inicio: 2005, fim: 2026 }
cobertura_geografica: município e estado (UF)
# Toda consulta gerada é obrigada a filtrar por estas colunas. Cada nome
# aqui precisa existir em `colunas` com `particao: true`.
particoes: [ano, sigla_uf]
sem_particao: false
volume_aproximado: 73.445.151 linhas
observacoes: |
  Os nomes dos municípios devem ser buscados na API do IBGE, pois a tabela só contém o 
  código do município (id_municipio).
  Para acessar a API do IBGE, utilize o GET Disponível, substituindo {UF} pela sigla do 
  Estado ou do Distrito Federal.
  Endereço da API - https://servicodados.ibge.gov.br/api/v1/localidades/estados/{UF}/municipios

  Os nomes dos estabelecimentos devem ser buscados na API do CNES, pois a tabela só 
  contém o código do estabelecimento (id_estabelecimento_cnes).
  Para acessar a API do CNES, utilize o GET Disponível, substituindo {codigo_CNES} 
  pelo código do estabelecimento (id_estabelecimento_cnes).
  Endereço da API - https://apidadosabertos.saude.gov.br/cnes/estabelecimentos/{codigo_CNES}

