# ─── CONSULTAS DE EXEMPLO (duas ou três, ensinando o filtro de partição) ──
consultas_exemplo:
  - pergunta: Quantos hospitais existiam no Estado de Pernambuco?
    sql: |
      SELECT COUNT(DISTINCT id_estabelecimento_cnes)
      FROM `basedosdados.br_ms_cnes.estabelecimento`
      WHERE
        sigla_uf = 'PE'
        AND tipo_unidade IN ('5', '7', '62') # tipos que são hospitais (https://apidadosabertos.saude.gov.br/cnes/tipounidades)
