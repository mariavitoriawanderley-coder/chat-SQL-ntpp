# Revisado com os metadados oficiais da Base dos Dados (API pública e tabela
# br_me_caged.dicionario), consultados em 13/10/2026.
#
# O formato completo, campo a campo, está em `catalog/_schema.yaml`.
# Depois de editar:  make validar-catalogo

# ─── IDENTIFICAÇÃO ────────────────────────────────────────────────
id: br_me_caged__microdados_movimentacao_fora_prazo
dataset_id: br_me_caged
table_id: microdados_movimentacao_fora_prazo
nome_exibicao: Novo Caged — Movimentações declaradas fora do prazo
area: economia
fonte: Ministério do Trabalho e Emprego
url_documentacao: https://basedosdados.org/dataset/562b56a3-0b01-4735-a049-eeac5681f056?table=55547cad-3e88-4f7c-b27f-726b2b9b0b47
status: rascunho

# ─── RESUMO (etapa 2 — é o ÚNICO texto que o modelo lê para escolher
#     esta tabela; 3 a 6 linhas de prosa, mínimo de 20 palavras) ────
resumo: >
  Admissões e desligamentos de empregos formais que os empregadores enviaram
  ao Novo Caged depois do prazo do mês a que se referem. Cada linha é uma
  movimentação de um trabalhador, com a competência original, município,
  setor (CNAE), ocupação, salário e perfil do trabalhador. Não responde
  perguntas sozinha: é a parcela que se SOMA à tabela de movimentações no
  prazo para chegar ao saldo oficial de empregos de cada mês.

palavras_chave: [emprego, desemprego, Caged, carteira assinada, admissões, demissões, desligamentos, saldo de empregos, vagas, salário, mercado de trabalho, ocupação, setor econômico]

perguntas_exemplo:
  - "Qual foi o saldo de empregos formais em Pernambuco em cada mês de 2025?"
  - "Quais setores mais geraram empregos no Recife em 2025?"
  - "Qual o salário médio de admissão de homens e mulheres em Pernambuco em 2025?"

# ─── CARACTERÍSTICAS ──────────────────────────────────────────────
grao: Uma linha por movimentação (admissão ou desligamento) declarada depois do prazo da sua competência.
cobertura_temporal: { inicio: 2020, fim: 2026 }
cobertura_geografica: Brasil, por UF e município do estabelecimento
# Toda consulta gerada é obrigada a filtrar por estas colunas. Cada nome
# aqui precisa existir em `colunas` com `particao: true`.
particoes: [ano]
sem_particao: false
volume_aproximado: 8,8 milhões de linhas
observacoes: |
  Esta tabela é complemento de `microdados_movimentacao`. As movimentações
  daqui SOMAM ao saldo do mês indicado em `ano_competencia_movimentacao` e
  `mes_competencia_movimentacao` — e não ao de `ano`/`mes`, que marcam a
  declaração. Una as três tabelas listando as colunas pelo nome.

  Os códigos do Caged são próprios e diferem de outras bases: sexo 3 = Mulher;
  raça/cor 3 = Parda (veja `nota` de cada coluna).

  Nome do município: una com `basedosdados.br_bd_diretorios_brasil.municipio`
  pela coluna `id_municipio`.

# ─── COLUNAS (etapa 3 — só as que alguém usaria de fato) ───────────
colunas:
  - nome: ano
    tipo: INT64
    descricao: Ano em que a movimentação foi declarada (não o da competência).
    particao: true

  - nome: mes
    tipo: INT64
    descricao: Mês em que a movimentação foi declarada (não o da competência).

  - nome: sigla_uf
    tipo: STRING
    descricao: Sigla da Unidade da Federação do estabelecimento.
    valores_exemplo: [PE, AL, PB, BA, SP]

  - nome: ano_competencia_movimentacao
    tipo: INT64
    descricao: Ano de competência da movimentação — o mês a que ela se refere.
    nota: Use esta coluna (e não `ano`) para somar ao saldo da competência.

  - nome: mes_competencia_movimentacao
    tipo: INT64
    descricao: Mês de competência da movimentação (1 a 12).
    nota: Use esta coluna (e não `mes`) para somar ao saldo da competência.

  - nome: id_municipio
    tipo: STRING
    descricao: Código IBGE de 7 dígitos do município do estabelecimento.
    valores_exemplo: ["2611606", "2604106", "2607901"]
    nota: Recife = 2611606; Caruaru = 2604106; Jaboatão dos Guararapes = 2607901.

  - nome: saldo_movimentacao
    tipo: INT64
    descricao: Sentido da movimentação.
    valores_exemplo: ["1", "-1"]
    nota: 1 = Admissão; -1 = Desligamento. SUM(saldo_movimentacao) dá o saldo de empregos.

  - nome: tipo_movimentacao
    tipo: STRING
    descricao: Motivo detalhado da admissão ou do desligamento.
    valores_exemplo: ["10", "20", "31", "40", "90"]
    nota: >-
      10 = Primeiro emprego; 20 = Reemprego; 25 = Contrato por prazo determinado;
      35 = Reintegração; 70 = Transferência (admissão); 31 = Demissão sem justa causa;
      32 = Demissão com justa causa; 40 = A pedido; 43 e 45 = Término de contrato;
      50 = Aposentadoria; 60 = Morte; 80 = Transferência (desligamento);
      90 = Acordo entre empregado e empregador; 99 = Não identificado.

  - nome: cnae_2_secao
    tipo: STRING
    descricao: Seção da atividade econômica do estabelecimento (CNAE 2.0), uma letra de A a U.
    valores_exemplo: [C, F, G, I, P, Q]
    nota: >-
      C = Indústrias de transformação; F = Construção; G = Comércio; I = Alojamento e
      alimentação; O = Administração pública; P = Educação; Q = Saúde humana e serviços sociais.

  - nome: cnae_2_subclasse
    tipo: STRING
    descricao: Subclasse da atividade econômica (CNAE 2.0), código de 7 dígitos.

  - nome: cbo_2002
    tipo: STRING
    descricao: Ocupação do trabalhador na Classificação Brasileira de Ocupações (CBO 2002), 6 dígitos.

  - nome: categoria
    tipo: STRING
    descricao: Categoria do vínculo de trabalho.
    valores_exemplo: ["101", "103", "104", "111"]
    nota: 101 = Empregado geral (CLT); 103 = Aprendiz; 104 = Doméstico; 106 = Temporário; 111 = Intermitente; 999 = Não identificado.

  - nome: salario_mensal
    tipo: FLOAT64
    descricao: Salário mensal contratual, em reais correntes.
    nota: Há valores extremos e zerados; para média, prefira a mediana (APPROX_QUANTILES) ou exclua salário zero.

  - nome: horas_contratuais
    tipo: INT64
    descricao: Horas semanais previstas no contrato.

  - nome: sexo
    tipo: STRING
    descricao: Sexo do trabalhador.
    valores_exemplo: ["1", "3", "9"]
    nota: 1 = Homem; 3 = Mulher; 9 = Não identificado. Atenção, Mulher é 3, não 2.

  - nome: idade
    tipo: INT64
    descricao: Idade do trabalhador, em anos.

  - nome: raca_cor
    tipo: STRING
    descricao: Raça ou cor do trabalhador.
    valores_exemplo: ["1", "2", "3", "4", "5", "6", "9"]
    nota: 1 = Branca; 2 = Preta; 3 = Parda; 4 = Amarela; 5 = Indígena; 6 = Não informada; 9 = Não identificado.

  - nome: grau_instrucao
    tipo: STRING
    descricao: Escolaridade do trabalhador.
    valores_exemplo: ["1", "5", "7", "9"]
    nota: >-
      1 = Analfabeto; 2 = Até 5º ano incompleto; 3 = 5º ano completo; 4 = 6º ao 9º ano;
      5 = Fundamental completo; 6 = Médio incompleto; 7 = Médio completo;
      8 = Superior incompleto; 9 = Superior completo; 10 = Mestrado; 11 = Doutorado;
      80 = Pós-graduação completa; 99 = Não identificado.

  - nome: tipo_deficiencia
    tipo: STRING
    descricao: Tipo de deficiência do trabalhador (ou beneficiário reabilitado).
    valores_exemplo: ["0", "1", "2", "3", "4", "5", "6"]
    nota: 0 = Não deficiente; 1 = Física; 2 = Auditiva; 3 = Visual; 4 = Intelectual; 5 = Múltipla; 6 = Reabilitado; 9 = Não identificado.

  - nome: tipo_empregador
    tipo: STRING
    descricao: Tipo de inscrição do empregador.
    valores_exemplo: ["0", "2"]
    nota: 0 = CNPJ (empresa); 2 = CPF (pessoa física); 9 = Não identificado.

  - nome: tipo_estabelecimento
    tipo: STRING
    descricao: Tipo de inscrição do estabelecimento.
    valores_exemplo: ["1", "3", "4"]
    nota: 1 = CNPJ; 3 = CAEPF (pessoa física com atividade econômica); 4 = CNO (obra); 5 = CEI; 9 = Não identificado.

  - nome: tamanho_estabelecimento_janeiro
    tipo: STRING
    descricao: Faixa de tamanho do estabelecimento pelo número de vínculos em janeiro.
    valores_exemplo: ["2", "5", "7", "10"]
    nota: >-
      1 = Nenhum vínculo; 2 = 1 a 4; 3 = 5 a 9; 4 = 10 a 19; 5 = 20 a 49; 6 = 50 a 99;
      7 = 100 a 249; 8 = 250 a 499; 9 = 500 a 999; 10 = 1.000 ou mais; 99 = Não identificado.

  - nome: indicador_aprendiz
    tipo: STRING
    descricao: Indica se o trabalhador é aprendiz.
    valores_exemplo: ["0", "1"]
    nota: 0 = Não; 1 = Sim; 9 = Não identificado.

  - nome: indicador_trabalho_intermitente
    tipo: STRING
    descricao: Indica se o contrato é de trabalho intermitente.
    valores_exemplo: ["0", "1"]
    nota: 0 = Não; 1 = Sim; 9 = Não identificado.

  - nome: indicador_trabalho_parcial
    tipo: STRING
    descricao: Indica se o contrato é de tempo parcial.
    valores_exemplo: ["0", "1"]
    nota: 0 = Não; 1 = Sim; 9 = Não identificado.

  - nome: indicador_fora_prazo
    tipo: STRING
    descricao: Indica se a movimentação foi declarada fora do prazo.

  - nome: origem_informacao
    tipo: STRING
    descricao: Sistema de origem da declaração (eSocial ou Caged).

# ─── CONSULTAS DE EXEMPLO (duas ou três, ensinando o filtro de partição) ──
consultas_exemplo:
  - pergunta: Qual foi o saldo de empregos formais em Pernambuco em cada mês de 2025?
    sql: |
      WITH movimentacoes AS (
        SELECT mes, saldo_movimentacao, 1 AS peso
        FROM `basedosdados.br_me_caged.microdados_movimentacao`
        WHERE sigla_uf = 'PE' AND ano = 2025 AND mes BETWEEN 1 AND 12
        UNION ALL
        SELECT mes_competencia_movimentacao, saldo_movimentacao, 1 AS peso
        FROM `basedosdados.br_me_caged.microdados_movimentacao_fora_prazo`
        WHERE sigla_uf = 'PE' AND ano >= 2025 AND ano_competencia_movimentacao = 2025
        UNION ALL
        SELECT mes_competencia_movimentacao, saldo_movimentacao, -1 AS peso
        FROM `basedosdados.br_me_caged.microdados_movimentacao_excluida`
        WHERE sigla_uf = 'PE' AND ano >= 2025 AND ano_competencia_movimentacao = 2025
      )
      SELECT
        mes,
        SUM(IF(saldo_movimentacao = 1, peso, 0)) AS admissoes,
        SUM(IF(saldo_movimentacao = -1, peso, 0)) AS desligamentos,
        SUM(saldo_movimentacao * peso) AS saldo
      FROM movimentacoes
      GROUP BY mes
      ORDER BY mes

  - pergunta: Quais setores mais geraram empregos no Recife em 2025?
    sql: |
      WITH movimentacoes AS (
        SELECT cnae_2_secao, saldo_movimentacao, 1 AS peso
        FROM `basedosdados.br_me_caged.microdados_movimentacao`
        WHERE sigla_uf = 'PE' AND ano = 2025 AND mes BETWEEN 1 AND 12
          AND id_municipio = '2611606'
        UNION ALL
        SELECT cnae_2_secao, saldo_movimentacao, 1 AS peso
        FROM `basedosdados.br_me_caged.microdados_movimentacao_fora_prazo`
        WHERE sigla_uf = 'PE' AND ano >= 2025 AND ano_competencia_movimentacao = 2025
          AND id_municipio = '2611606'
        UNION ALL
        SELECT cnae_2_secao, saldo_movimentacao, -1 AS peso
        FROM `basedosdados.br_me_caged.microdados_movimentacao_excluida`
        WHERE sigla_uf = 'PE' AND ano >= 2025 AND ano_competencia_movimentacao = 2025
          AND id_municipio = '2611606'
      )
      SELECT cnae_2_secao AS secao_cnae, SUM(saldo_movimentacao * peso) AS saldo
      FROM movimentacoes
      GROUP BY secao_cnae
      ORDER BY saldo DESC

  - pergunta: Qual o salário mediano de admissão de homens e mulheres em Pernambuco em 2025?
    sql: |
      SELECT
        CASE sexo WHEN '1' THEN 'Homem' WHEN '3' THEN 'Mulher' ELSE 'Não identificado' END AS sexo,
        COUNT(*) AS admissoes,
        APPROX_QUANTILES(salario_mensal, 2)[OFFSET(1)] AS salario_mediano
      FROM `basedosdados.br_me_caged.microdados_movimentacao`
      WHERE sigla_uf = 'PE'
        AND ano = 2025
        AND mes BETWEEN 1 AND 12
        AND saldo_movimentacao = 1
        AND salario_mensal > 0
      GROUP BY sexo
