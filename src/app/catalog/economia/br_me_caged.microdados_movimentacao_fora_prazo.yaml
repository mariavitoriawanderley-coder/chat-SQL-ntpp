# ─── CAGED - MICRODADOS - MOVIMENTAÇÃO - FORA DO PRAZO ────────────────────────────────────────────────
id: br_me_caged.microdados_movimentacao_fora_prazo
dataset_id: br_me_caged
table_id: microdados_movimentacao_fora_prazo
nome_exibicao: Novo Caged — Movimentações de emprego entregues fora do prazo
area: economia
fonte: Ministério do Trabalho e Emprego
url_documentacao: https://basedosdados.org/dataset/562b56a3-0b01-4735-a049-eeac5681f056?table=55547cad-3e88-4f7c-b27f-726b2b9b0b47
status: rascunho

# ─── RESUMO (etapa 2 — é o ÚNICO texto que o modelo lê para escolher
#     esta tabela; 3 a 6 linhas de prosa, mínimo de 20 palavras) ────
resumo: >
  Contém dados de movimentações de emprego (admissões e desligamentos) declaradas fora do prazo da competência de declaração. 
  As declarações são enviadas pelos empregadores (então são somente empregos formais, ou seja, a prequisa não inclui empregos informais).
  Pode ser usada para conhecer as movimentações de emprego po setor (CNAE), ocupação, grau de instrução do trabalhador, horas trabalhadas, 
  município, sexo, faixa etária, faixa salarial, escolaridade, tipo de empregador e tipo de deficiência do trabalhador.

palavras_chave: [emprego, caged, salário, trabalho, mercado de trabalho, admissões, demissões, ocupação]

perguntas_exemplo:
  - "Quantos trabalhadores foram admitidos e demitidos no setor industrial por município de Pernambuco em 2025?"
  - "Qual a faixa salarial média dos trabalhadores admitidos em Pernambuco em 2025 por ocupação e por município?"
  - "Qual o saldo de admissões e desligamentos por faixa etária e sexo em Pernambuco entre 2022 e 2025?"

# ─── CARACTERÍSTICAS ──────────────────────────────────────────────
grao: uma linha por tipo de movimentação, CNAE, mês da competência, ano da competência, UF, município, tipo de estabelecimento, CBO (código de brasileiro de ocupação) e quantidade de movimentações.
cobertura_temporal: { inicio: 2020, fim: 2026 }
cobertura_geografica: Estado (UF) e município
# Toda consulta gerada é obrigada a filtrar por estas colunas. Cada nome
# aqui precisa existir em `colunas` com `particao: true`.
particoes: [mes,ano,sigla_uf]
sem_particao: false
volume_aproximado: 8.675.517 linhas
observacoes: |
  Serve de complemento à tabela br_me_caged.microdados_movimentacao, que contém as movimentações dentro do prazo.
  Para acessar a API do IBGE, utilize o GET Disponível, substituindo {UF} pela sigla do 
  Estado ou do Distrito Federal.
  Endereço da API - https://servicodados.ibge.gov.br/api/v1/localidades/estados/{UF}/municipios

# ─── COLUNAS (etapa 3 — só as que alguém usaria de fato) ───────────
colunas: [ano, mes, ano_competencia_movimentacao, mes_competencia_movimentacao, sigla_uf, id_municipio, 
  cnae_2_secao, cnae_2_subclasse, saldo_movimentacao, cbo_2002, grau_instrucao, idade, horas_contratuais, 
  raca_cor, sexo, tipo_empregador, tipo_estabelecimento, tipo_movimentacao, tipo_deficiencia, 
  indicador_trabalho_intermitente, indicador_trabalho_parcial, salario_mensal,
  tamanho_estabelecimento_janeiro, indicador_aprendiz, origem_informacao, indicador_fora_prazo, categoria
  ]

# ─── CONSULTAS DE EXEMPLO (duas ou três, ensinando o filtro de partição) ──
consultas_exemplo: [
  with tabelas_unidas as (
  select *, 0 as indicador_exclusao from `basedosdados.br_me_caged.microdados_movimentacao`
  union all
  select * except (ano,mes), 0 as indicador_exclusao from `basedosdados.br_me_caged.microdados_movimentacao_fora_prazo`
  union all
  select * except (ano,mes, ano_declaracao_movimentacao, mes_declaracao_movimentacao, indicador_exclusao), 1 as indicador_exclusao from `basedosdados.br_me_caged.microdados_movimentacao_excluida`)
  where sigla_uf='SP' and ano=2025 and mes=1

  tabela_ajustada as (
  select *,
  case
    when saldo_movimentacao = 1 then 'admissão'
    when saldo_movimentacao = -1 then 'desligamento'
  end as admissao_desligamento,
  case
    when indicador_exclusao = 0 then saldo_movimentacao
    when indicador_exclusao = 1 then -saldo_movimentacao
  end as saldo_movimentacao_ajustado
  from tabelas_unidas)
  where sigla_uf='SP' and ano=2025 and mes=1

  select
  ano,
  mes,
  sum(if(admissao_desligamento = 'admissão', saldo_movimentacao_ajustado, 0)) as qte_admissoes,
  sum(if(admissao_desligamento = 'desligamento', saldo_movimentacao_ajustado, 0))as qte_desligamentos,
  sum(saldo_movimentacao_ajustado) as saldo,
  from tabela_ajustada
  where sigla_uf='SP' and ano=2025 and mes=1
  group by 1, 2
  order by ano, mes

  ]