# ─── CAGED - MICRODADOS - MOVIMENTAÇÃO - EXCLUÍDAS ────────────────────────────────────────────────
id: br_me_caged__microdados_movimentacao_excluida
dataset_id: br_me_caged
table_id: microdados_movimentacao_excluida
nome_exibicao: Novo Caged — Movimentações de emprego excluídas
area: economia
fonte: Ministério do Trabalho e Emprego
url_documentacao: https://basedosdados.org/dataset/562b56a3-0b01-4735-a049-eeac5681f056?table=f0fa3d45-ef23-4fa3-940e-a9bb19975433
status: rascunho

# ─── RESUMO (etapa 2 — é o ÚNICO texto que o modelo lê para escolher
#     esta tabela; 3 a 6 linhas de prosa, mínimo de 20 palavras) ────
resumo: >
  Contém dados de movimentações de emprego (admissões e desligamentos) que foram posteriormente canceladas (excluídas) da competência de declaração. 
  As declarações são enviadas pelos empregadores (então são somente empregos formais, ou seja, a pesquisa não inclui empregos informais).
  Pode ser usada para conhecer as movimentações de emprego por setor (CNAE), ocupação, grau de instrução do trabalhador, horas trabalhadas, 
  município, sexo, faixa etária, faixa salarial, escolaridade, tipo de empregador e tipo de deficiência do trabalhador.

palavras_chave: [emprego, caged, salário, trabalho, mercado de trabalho, admissões, demissões, ocupação]

perguntas_exemplo:
  - "Quantos trabalhadores foram admitidos e demitidos no setor industrial por município de Pernambuco em 2025?"
  - "Qual a faixa salarial média dos trabalhadores admitidos em Pernambuco em 2025 por ocupação e por município?"
  - "Qual o saldo de admissões e desligamentos por faixa etária e sexo em Pernambuco entre 2022 e 2025?"

# ─── CARACTERÍSTICAS ──────────────────────────────────────────────
grao: uma linha por tipo de movimentação, CNAE, mês da competência, ano da competência, UF, município, tipo de estabelecimento, CBO (Classificação Brasileira de Ocupações) e quantidade de movimentações.
cobertura_temporal: { inicio: 2020, fim: 2026 }
cobertura_geografica: Estado (UF) e município
# Toda consulta gerada é obrigada a filtrar por estas colunas. Cada nome
# aqui precisa existir em `colunas` com `particao: true`.
particoes: [mes,ano,sigla_uf]
sem_particao: false
volume_aproximado: 616.216 linhas
observacoes: |
  Serve de complemento à tabela br_me_caged.microdados_movimentacao, que contém as movimentações enviadas dentro do prazo.
  Para acessar a API do IBGE, utilize o GET Disponível, substituindo {UF} pela sigla do 
  Estado ou do Distrito Federal.
  Endereço da API - https://servicodados.ibge.gov.br/api/v1/localidades/estados/{UF}/municipios

