# ─── CONSULTAS DE EXEMPLO (duas ou três, ensinando o filtro de partição) ──
consultas_exemplo:
  - pergunta: Saldo de admissões e desligamentos em São Paulo em janeiro de 2025.
    sql: |
      WITH tabelas_unidas AS (
        SELECT *, 0 AS indicador_exclusao
        FROM `basedosdados.br_me_caged.microdados_movimentacao`
        UNION ALL
        SELECT * EXCEPT (ano, mes), 0 AS indicador_exclusao
        FROM `basedosdados.br_me_caged.microdados_movimentacao_fora_prazo`
        UNION ALL
        SELECT * EXCEPT (ano, mes, ano_declaracao_movimentacao, mes_declaracao_movimentacao, indicador_exclusao), 1 AS indicador_exclusao
        FROM `basedosdados.br_me_caged.microdados_movimentacao_excluida`
      ),

      tabela_ajustada AS (
        SELECT *,
          CASE
            WHEN saldo_movimentacao = 1 THEN 'admissão'
            WHEN saldo_movimentacao = -1 THEN 'desligamento'
          END AS admissao_desligamento,
          CASE
            WHEN indicador_exclusao = 0 THEN saldo_movimentacao
            WHEN indicador_exclusao = 1 THEN -saldo_movimentacao
          END AS saldo_movimentacao_ajustado
        FROM tabelas_unidas
      )

      SELECT
        ano,
        mes,
        SUM(IF(admissao_desligamento = 'admissão', saldo_movimentacao_ajustado, 0)) AS qte_admissoes,
        SUM(IF(admissao_desligamento = 'desligamento', saldo_movimentacao_ajustado, 0)) AS qte_desligamentos,
        SUM(saldo_movimentacao_ajustado) AS saldo
      FROM tabela_ajustada
      WHERE sigla_uf = 'SP' AND ano = 2025 AND mes = 1
      GROUP BY 1, 2
      ORDER BY ano, mes
